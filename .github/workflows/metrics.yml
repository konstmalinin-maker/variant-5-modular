name: Tests and architecture metrics
on: [push, pull_request]
permissions:
  contents: read
  pull-requests: write
jobs:
  verify:
    strategy:
      matrix:
        storage: [sqlite, json]
    runs-on: ubuntu-latest
    env:
      STORAGE: ${{ matrix.storage }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: python scripts/check_layers.py
      - run: python -m pytest -q --cov --cov-report=json --cov-report=xml --cov-report=html --cov-fail-under=80 --junitxml=junit.xml
      - run: radon cc . -a -s > radon.txt
      - run: python scripts/collect_metrics.py . metrics.json
      - uses: actions/upload-artifact@v4
        with:
          name: metrics-${{ matrix.storage }}
          path: |
            metrics.json
            radon.txt
            coverage.json
            coverage.xml
            junit.xml
            htmlcov/
      - name: Comment PR with measured summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('metrics.json','utf8'));
            const marker = '<!-- metrics-${{ matrix.storage }} -->';
            const body = marker + '\nBackend: **${{ matrix.storage }}** | Tests: **' + m.tests + '** | Coverage: **' + m.coverage.toFixed(2) + '%** | Average CC: **' + m.cc_average + '** | Internal imports: **' + m.internal_imports + '** | Test time: **' + m.test_seconds + ' s**.\nLayer check: passed. Full data: Actions artifact `metrics-${{ matrix.storage }}`.';
            const comments = await github.rest.issues.listComments({...context.repo,issue_number:context.issue.number});
            const old = comments.data.find(c => c.body.startsWith(marker) && c.user.type === 'Bot');
            if (old) await github.rest.issues.updateComment({...context.repo,comment_id:old.id,body});
            else await github.rest.issues.createComment({...context.repo,issue_number:context.issue.number,body});
